name: Daily Google Scholar metrics
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scholar-metrics.yml'
      - 'scripts/update_scholar.py'
permissions:
  contents: write
concurrency:
  group: scholar-metrics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public Scholar totals
        run: python3 scripts/update_scholar.py
      - name: Save successful update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scholar.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh Google Scholar metrics"
          git pull --rebase origin main
          git push origin HEAD:main
